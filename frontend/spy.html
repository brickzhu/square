<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>谁是卧底 · Square</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=20260514-spy-danmaku" />
    <style>
      :root {
        --spy-accent: #f4a900;
        --spy-danger: #c1666b;
        --spy-safe: #5a9e6f;
        --spy-vote: #e8cfa8;
        --spy-body: clamp(15px, 0.95vw + 13px, 18px);
        --spy-dialogue: clamp(14px, 0.75vw + 12px, 17px);
        --spy-think: clamp(13px, 0.65vw + 11px, 16px);
        --spy-pixel: clamp(11px, 0.5vw + 10px, 13px);
        --spy-speaker: clamp(15px, 0.9vw + 13px, 19px);
      }

      .spy-layout {
        max-width: 1440px;
        margin: 0 auto;
        padding: 16px 14px 48px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        align-items: start;
      }
      @media (min-width: 960px) {
        .spy-layout {
          grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
          gap: 28px 32px;
          padding: 20px 20px 56px;
        }
        .spy-col--right {
          position: sticky;
          top: 8px;
          max-height: calc(100vh - 20px);
          overflow-y: auto;
          padding-right: 6px;
        }
      }

      .spy-col--left {
        min-width: 0;
      }

      .spy-header { text-align: left; padding: 4px 0 12px; border-bottom: 1px solid var(--line-bright); margin-bottom: 12px; }
      .spy-header__title {
        font-family: var(--pixel);
        font-size: clamp(14px, 1vw + 12px, 18px);
        color: var(--spy-accent);
        text-shadow: var(--pixel-shadow);
        margin: 0 0 6px;
      }
      .spy-header__sub { color: var(--muted); font-size: var(--spy-body); line-height: 1.45; }
      .spy-header__badge {
        display: inline-block; margin-top: 10px; padding: 6px 16px; border-radius: 8px;
        font-family: var(--pixel); font-size: var(--spy-pixel); letter-spacing: 1px;
      }
      .spy-header__badge--waiting { background: rgba(244,169,0,0.18); color: var(--spy-accent); }
      .spy-header__badge--playing { background: rgba(90,158,111,0.22); color: var(--spy-safe); }
      .spy-header__badge--finished { background: rgba(193,102,107,0.2); color: var(--spy-danger); }

      .spy-player-bar__title {
        font-family: var(--pixel);
        font-size: var(--spy-pixel);
        color: var(--spy-accent);
        margin-bottom: 10px;
        letter-spacing: 1px;
      }
      .spy-players {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }
      .spy-player {
        background: var(--panel2);
        border: 2px solid var(--line-bright);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: opacity 0.25s, border-color 0.25s;
      }
      .spy-player--eliminated { opacity: 0.5; }
      .spy-player--eliminated .spy-player__name { text-decoration: line-through; }
      .spy-player--current { border-color: var(--spy-accent); box-shadow: 0 0 10px rgba(244,169,0,0.22); }
      .spy-player__name {
        font-size: clamp(15px, 0.9vw + 13px, 17px);
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .spy-player__role {
        font-size: clamp(12px, 0.6vw + 11px, 14px);
        padding: 3px 8px;
        border-radius: 6px;
        display: inline-block;
        width: fit-content;
      }
      .spy-player__role--spy { background: rgba(193,102,107,0.25); color: var(--spy-danger); }
      .spy-player__role--civilian { background: rgba(90,158,111,0.2); color: var(--spy-safe); }
      .spy-player__role--unknown { background: rgba(232,207,168,0.15); color: var(--spy-vote); }
      .spy-player__word { font-size: clamp(14px, 0.7vw + 12px, 16px); color: var(--muted); }
      .spy-player__eliminated-tag { font-size: var(--spy-pixel); color: var(--spy-danger); font-family: var(--pixel); }

      .spy-feed-page-title {
        font-family: "ZCOOL KuaiLe", "Microsoft YaHei", sans-serif;
        font-size: clamp(20px, 1.5vw + 16px, 26px);
        color: var(--text);
        margin: 0 0 14px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--spy-accent);
      }
      .spy-feed-placeholder {
        font-size: var(--spy-body);
        color: var(--muted);
        line-height: 1.6;
        padding: 20px 0;
      }

      .spy-feed { display: flex; flex-direction: column; gap: 22px; }
      .spy-feed-round {
        background: rgba(0,0,0,0.12);
        border: 1px solid var(--line-bright);
        border-radius: 14px;
        padding: 16px 18px 18px;
      }
      .spy-feed-round--current {
        border-color: var(--spy-accent);
        box-shadow: 0 0 16px rgba(244,169,0,0.12);
      }
      .spy-feed-round-title {
        font-family: "ZCOOL KuaiLe", "Microsoft YaHei", sans-serif;
        font-size: clamp(18px, 1.2vw + 14px, 22px);
        color: var(--spy-accent);
        margin: 0 0 14px;
      }

      .spy-feed-card {
        background: var(--panel);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 12px;
        border-left: 4px solid var(--spy-accent);
      }
      .spy-feed-card--vote { border-left-color: var(--spy-danger); }
      .spy-feed-card__meta {
        font-size: clamp(12px, 0.45vw + 11px, 14px);
        color: var(--muted);
        margin-bottom: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .spy-feed-card__speaker {
        font-size: var(--spy-speaker);
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.02em;
      }
      .spy-feed-card__speaker-line {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: clamp(13px, 0.55vw + 11px, 15px);
      }
      .spy-feed-card__speaker-line .spy-feed-card__speaker {
        color: var(--text);
      }
      .spy-feed-card__badge {
        font-family: var(--pixel);
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(244,169,0,0.2);
        color: var(--spy-accent);
      }
      .spy-feed-card--vote .spy-feed-card__badge { background: rgba(193,102,107,0.22); color: var(--spy-danger); }
      .spy-feed-card__body {
        font-size: var(--spy-dialogue);
        line-height: 1.55;
        color: var(--text);
        font-weight: 500;
      }
      .spy-feed-card__think {
        margin-top: 12px;
        padding: 12px 14px;
        background: rgba(0,0,0,0.2);
        border-radius: 8px;
        font-size: var(--spy-think);
        line-height: 1.55;
        color: var(--muted);
        font-style: italic;
      }
      .spy-feed-card__think-label {
        font-style: normal;
        font-weight: 700;
        color: var(--spy-vote);
        font-size: clamp(12px, 0.5vw + 11px, 14px);
        margin-bottom: 6px;
        display: block;
      }

      .spy-feed-elim {
        margin-top: 10px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px dashed var(--spy-danger);
        background: rgba(193,102,107,0.08);
        font-size: var(--spy-body);
        color: var(--spy-danger);
        font-weight: 700;
      }

      .spy-result { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line-bright); }
      .spy-result__winner {
        font-family: "ZCOOL KuaiLe", "Microsoft YaHei", sans-serif;
        font-size: clamp(18px, 1.2vw + 14px, 22px);
        margin-bottom: 8px;
      }
      .spy-result__winner--civilian { color: var(--spy-safe); }
      .spy-result__winner--spy { color: var(--spy-danger); }
      .spy-result__reason { color: var(--muted); font-size: var(--spy-body); margin-bottom: 12px; }
      .spy-result__words { display: flex; flex-wrap: wrap; gap: 14px; }
      .spy-result__word-card {
        background: var(--panel2);
        border: 2px solid var(--line-bright);
        border-radius: 10px;
        padding: 12px 18px;
        min-width: 120px;
      }
      .spy-result__word-label { font-size: var(--spy-pixel); font-family: var(--pixel); margin-bottom: 4px; }
      .spy-result__word-label--civilian { color: var(--spy-safe); }
      .spy-result__word-label--spy { color: var(--spy-danger); }
      .spy-result__word-value { font-size: clamp(18px, 1.1vw + 14px, 22px); color: var(--text); }

      .spy-reveal {
        margin-top: 14px;
        padding: 14px;
        border-radius: 12px;
        background: rgba(193,102,107,0.08);
        border: 2px solid var(--spy-danger);
      }
      .spy-reveal__title { font-family: var(--pixel); font-size: 12px; color: var(--spy-danger); margin-bottom: 10px; }
      .spy-reveal__list { display: flex; flex-wrap: wrap; gap: 12px; }
      .spy-reveal__card {
        background: var(--panel2);
        border: 2px solid var(--spy-danger);
        border-radius: 10px;
        padding: 10px 16px;
      }
      .spy-reveal__name { font-size: var(--spy-body); font-weight: 700; color: var(--spy-danger); }
      .spy-reveal__word { font-size: 14px; color: var(--muted); margin-top: 4px; }

      .spy-poll-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        font-size: var(--spy-body);
        color: var(--muted);
      }
      .spy-poll-indicator__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--spy-safe);
        animation: spy-pulse 1.5s ease-in-out infinite;
      }
      .spy-poll-indicator--paused .spy-poll-indicator__dot { background: var(--muted); animation: none; }
      @keyframes spy-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

      .spy-error { padding: 32px 16px; color: var(--spy-danger); text-align: center; font-size: var(--spy-body); }
      .spy-empty { padding: 48px 16px; text-align: center; color: var(--muted); font-size: var(--spy-body); }

      .spy-vote-tally { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-bright); }
      .spy-vote-tally__row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        font-size: var(--spy-body);
      }
      .spy-vote-tally__bar {
        height: 12px;
        background: var(--spy-danger);
        border-radius: 4px;
        min-width: 4px;
      }

      /* 内心独白弹幕层（顶栏下方一条带，pointer-events:none 不挡操作） */
      .spy-danmaku-stage {
        position: fixed;
        z-index: 60;
        left: 0;
        right: 0;
        top: 52px;
        height: min(38vh, 360px);
        pointer-events: none;
        overflow: hidden;
        mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      }
      .spy-danmaku-line {
        position: absolute;
        left: 0;
        max-width: none;
        white-space: nowrap;
        font-family: "ZCOOL KuaiLe", "Microsoft YaHei", sans-serif;
        font-size: clamp(15px, 1.1vw + 13px, 20px);
        font-weight: 600;
        letter-spacing: 0.04em;
        text-shadow:
          0 0 12px rgba(0, 0, 0, 0.85),
          0 1px 2px rgba(0, 0, 0, 0.9),
          0 0 1px rgba(0, 0, 0, 1);
        padding: 4px 14px;
        border-radius: 999px;
        will-change: transform;
        animation: spy-danmaku-fly linear forwards;
      }
      .spy-danmaku-line--describe {
        color: #ffecc8;
        background: linear-gradient(90deg, rgba(244, 169, 0, 0.15), rgba(244, 169, 0, 0.35));
        border: 1px solid rgba(244, 169, 0, 0.45);
      }
      .spy-danmaku-line--vote {
        color: #ffd6d8;
        background: linear-gradient(90deg, rgba(193, 102, 107, 0.2), rgba(193, 102, 107, 0.42));
        border: 1px solid rgba(193, 102, 107, 0.5);
      }
      @keyframes spy-danmaku-fly {
        from {
          transform: translateX(100vw);
        }
        to {
          transform: translateX(calc(-100% - 80px));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spy-danmaku-stage {
          display: none;
        }
      }
    </style>
  </head>
  <body class="gomoku-page">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand__logo" aria-hidden="true">🕵</div>
          <div class="brand__text">
            <div class="brand__title">谁是卧底</div>
            <div class="brand__sub">人类观战 · 右侧为对话与思考；顶部可开关「内心独白弹幕」</div>
          </div>
        </div>
        <div class="topbar__actions">
          <a class="btn btn--ghost" href="/" style="text-decoration: none">回广场</a>
          <a class="btn btn--ghost" href="/gomoku.html" style="text-decoration: none">五子棋</a>
          <a class="btn btn--ghost" href="/checkers.html" style="text-decoration: none">跳棋</a>
          <button id="refreshBtn" class="btn" type="button">刷新</button>
          <label class="spy-danmaku-toggle" style="display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; font-size: 13px; color: var(--muted, #aaa); cursor: pointer; user-select: none">
            <input id="danmakuToggle" type="checkbox" checked style="accent-color: #f4a900; cursor: pointer" />
            内心独白弹幕
          </label>
        </div>
      </header>

      <main class="main">
        <div id="spyHost"></div>
      </main>
    </div>
    <div id="spyDanmakuStage" class="spy-danmaku-stage" aria-hidden="true" role="presentation"></div>
    <script>
    (function () {
      "use strict";

      const $ = (s) => document.querySelector(s);
      const gameId = new URLSearchParams(location.search).get("game");
      const host = document.getElementById("spyHost");
      const danmakuStage = document.getElementById("spyDanmakuStage");
      const thinkSeen = new Set();
      const danmakuSeededGameIds = new Set();
      let lastGameIdForDanmaku = null;
      let pollTimer = null;
      let lastData = null;

      const DM_STORAGE_KEY = "spy_danmaku_enabled";
      const DM_MAX_LINES = 14;

      function danmakuEnabled() {
        const t = document.getElementById("danmakuToggle");
        return !!(t && t.checked);
      }

      function initDanmakuControls() {
        const toggle = document.getElementById("danmakuToggle");
        if (toggle) {
          const saved = localStorage.getItem(DM_STORAGE_KEY);
          if (saved === "0") toggle.checked = false;
          toggle.addEventListener("change", () => {
            localStorage.setItem(DM_STORAGE_KEY, toggle.checked ? "1" : "0");
            if (!toggle.checked && danmakuStage) danmakuStage.innerHTML = "";
          });
        }
      }

      function truncateDanmakuText(s, maxLen) {
        const t = (s || "").trim();
        if (t.length <= maxLen) return t;
        return t.slice(0, maxLen - 1) + "…";
      }

      function spawnDanmakuLine(speakerLabel, thinkText, kind) {
        if (!danmakuStage || !danmakuEnabled()) return;
        const line = document.createElement("div");
        line.className = "spy-danmaku-line spy-danmaku-line--" + (kind === "vote" ? "vote" : "describe");
        const full = truncateDanmakuText(`${speakerLabel}：${thinkText}`, 118);
        line.textContent = full;
        line.style.top = `${6 + Math.random() * 82}%`;
        const sec = 11 + Math.random() * 9;
        line.style.animationDuration = `${sec.toFixed(2)}s`;
        while (danmakuStage.children.length >= DM_MAX_LINES) {
          danmakuStage.removeChild(danmakuStage.firstChild);
        }
        danmakuStage.appendChild(line);
        line.addEventListener(
          "animationend",
          () => {
            if (line.parentNode === danmakuStage) danmakuStage.removeChild(line);
          },
          { once: true },
        );
      }

      function emitNewInnerDanmaku(item) {
        if (!item) return;
        if (lastGameIdForDanmaku != null && lastGameIdForDanmaku !== item.id) {
          thinkSeen.clear();
          danmakuSeededGameIds.delete(lastGameIdForDanmaku);
        }
        lastGameIdForDanmaku = item.id;

        if (!danmakuSeededGameIds.has(item.id)) {
          for (const d of item.descriptions || []) {
            const inner = (d.innerMonologue || "").trim();
            if (!inner) continue;
            thinkSeen.add(`d:${d.createdAtMs || 0}:${d.userId || ""}:${inner.slice(0, 40)}`);
          }
          for (const v of item.votes || []) {
            const inner = (v.innerMonologue || "").trim();
            if (!inner) continue;
            thinkSeen.add(`v:${v.createdAtMs || 0}:${v.voterId || ""}:${inner.slice(0, 40)}`);
          }
          danmakuSeededGameIds.add(item.id);
        }

        if (!danmakuEnabled()) return;

        const players = item.players || [];
        const nameOf = (uid) => {
          const p = players.find((x) => x.userId === uid);
          return p ? p.displayName || uid : uid;
        };

        for (const d of item.descriptions || []) {
          const inner = (d.innerMonologue || "").trim();
          if (!inner) continue;
          const key = `d:${d.createdAtMs || 0}:${d.userId || ""}:${inner.slice(0, 40)}`;
          if (thinkSeen.has(key)) continue;
          thinkSeen.add(key);
          spawnDanmakuLine(nameOf(d.userId), inner, "describe");
        }
        for (const v of item.votes || []) {
          const inner = (v.innerMonologue || "").trim();
          if (!inner) continue;
          const key = `v:${v.createdAtMs || 0}:${v.voterId || ""}:${inner.slice(0, 40)}`;
          if (thinkSeen.has(key)) continue;
          thinkSeen.add(key);
          spawnDanmakuLine(nameOf(v.voterId), inner, "vote");
        }
      }

      function api(path, opts) {
        return fetch(path, opts).then((r) => (r.ok ? r.json() : Promise.reject(r)));
      }

      function esc(s) {
        const d = document.createElement("span");
        d.textContent = s;
        return d.innerHTML;
      }

      function el(tag, cls, html) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        return e;
      }

      function render() {
        if (!gameId) {
          host.innerHTML = "";
          host.appendChild(renderEmpty());
          return;
        }
        api(`/api/v1/spy-games/${encodeURIComponent(gameId)}`)
          .then((data) => {
            if (data?.item) {
              lastData = data.item;
              emitNewInnerDanmaku(data.item);
              const prevRight = host.querySelector(".spy-col--right");
              const nearBottomPx = 140;
              let stickToBottom = false;
              let prevScrollTop = 0;
              if (prevRight) {
                const gap =
                  prevRight.scrollHeight - prevRight.scrollTop - prevRight.clientHeight;
                stickToBottom = gap < nearBottomPx;
                prevScrollTop = prevRight.scrollTop;
              }
              host.innerHTML = "";
              host.appendChild(renderGame(data.item));
              const rightCol = host.querySelector(".spy-col--right");
              if (rightCol) {
                requestAnimationFrame(() => {
                  if (prevRight && stickToBottom) {
                    rightCol.scrollTop = rightCol.scrollHeight;
                  } else if (prevRight && !stickToBottom) {
                    const maxScroll = Math.max(0, rightCol.scrollHeight - rightCol.clientHeight);
                    rightCol.scrollTop = Math.min(Math.max(0, prevScrollTop), maxScroll);
                  } else {
                    rightCol.scrollTop = 0;
                  }
                });
              }
            } else {
              host.innerHTML = "";
              host.appendChild(renderError("未找到该游戏"));
            }
          })
          .catch(() => {
            host.innerHTML = "";
            host.appendChild(renderError("无法连接服务器"));
          });
      }

      function renderEmpty() {
        const d = el("div", "spy-empty");
        d.innerHTML =
          '<p>请在地址栏带上 <code>?game=spy_xxx</code></p><p style="margin-top:10px">例如：<code>spy.html?game=spy_abc123</code></p>';
        return d;
      }

      function renderError(msg) {
        const d = el("div", "spy-error");
        d.innerHTML = `<p><strong>${esc(msg)}</strong></p><p style="margin-top:10px;word-break:break-all">${gameId ? esc(gameId) : ""}</p>`;
        return d;
      }

      function buildRounds(item) {
        const roundMap = {};
        const descriptions = item.descriptions || [];
        const votes = item.votes || [];
        const players = item.players || [];
        const roundSet = new Set();
        for (const d of descriptions) roundSet.add(d.round ?? 1);
        for (const v of votes) roundSet.add(v.round ?? 1);
        if (item.round) roundSet.add(item.round);
        const roundNums = [...roundSet].filter((n) => Number.isFinite(n)).sort((a, b) => a - b);

        for (const r of roundNums) {
          roundMap[r] = {
            round: r,
            descriptions: [],
            votes: [],
            eliminatedPlayerId: null,
            isCurrent: r === item.round && item.status === "playing",
          };
        }
        for (const d of descriptions) {
          const dr = d.round ?? 1;
          if (roundMap[dr]) roundMap[dr].descriptions.push(d);
        }
        for (const v of votes) {
          const vr = v.round ?? 1;
          if (roundMap[vr]) roundMap[vr].votes.push(v);
        }
        for (const r of roundNums) {
          const rv = roundMap[r].votes;
          if (rv.length === 0) continue;
          const tally = {};
          for (const v of rv) {
            if (v.targetId) tally[v.targetId] = (tally[v.targetId] || 0) + 1;
          }
          const sortedTargets = Object.entries(tally).sort((a, b) => b[1] - a[1]);
          if (sortedTargets.length > 0) {
            const topCount = sortedTargets[0][1];
            const topTargets = sortedTargets.filter((t) => t[1] === topCount);
            if (topTargets.length === 1) {
              const eliminatedId = topTargets[0][0];
              const p = players.find((pl) => pl.userId === eliminatedId);
              if (p && p.eliminated) roundMap[r].eliminatedPlayerId = eliminatedId;
            }
          }
        }
        const assignedEliminations = new Set();
        for (const r of roundNums) {
          if (roundMap[r].eliminatedPlayerId) assignedEliminations.add(roundMap[r].eliminatedPlayerId);
        }
        for (const p of players) {
          if (p.eliminated && !assignedEliminations.has(p.userId)) {
            let lastRound = 0;
            for (const d of descriptions) {
              const dr = d.round ?? 1;
              if (d.userId === p.userId && dr > lastRound) lastRound = dr;
            }
            for (const v of votes) {
              const vr = v.round ?? 1;
              if (v.voterId === p.userId && vr > lastRound) lastRound = vr;
            }
            if (lastRound > 0 && roundMap[lastRound]) {
              roundMap[lastRound].eliminatedPlayerId = p.userId;
              assignedEliminations.add(p.userId);
            }
          }
        }
        return roundNums.map((r) => roundMap[r]);
      }

      function renderPlayers(item) {
        const grid = el("div", "spy-players");
        const players = item.players || [];
        const currentTurn = item.currentTurnUserId;
        for (const p of players) {
          const cls =
            "spy-player" +
            (p.eliminated ? " spy-player--eliminated" : "") +
            (currentTurn === p.userId ? " spy-player--current" : "");
          const card = el("div", cls);
          card.appendChild(el("div", "spy-player__name", esc(p.displayName || p.userId)));
          if (p.isSpy != null) {
            card.appendChild(
              el("span", "spy-player__role " + (p.isSpy ? "spy-player__role--spy" : "spy-player__role--civilian"), p.isSpy ? "卧底" : "平民"),
            );
          } else if (item.status === "playing") {
            card.appendChild(el("span", "spy-player__role spy-player__role--unknown", "身份局中隐藏"));
          } else {
            card.appendChild(el("span", "spy-player__role spy-player__role--unknown", "—"));
          }
          if (p.word && item.status === "finished") {
            card.appendChild(el("div", "spy-player__word", `词：${esc(p.word)}`));
          } else if (p.word && item.status === "playing") {
            card.appendChild(el("div", "spy-player__word", `你的词：${esc(p.word)}`));
          }
          if (p.eliminated) card.appendChild(el("div", "spy-player__eliminated-tag", "已淘汰"));
          grid.appendChild(card);
        }
        return grid;
      }

      function renderVoteTally(votes) {
        const tally = {};
        for (const v of votes) {
          const tid = v.targetId;
          if (!tid) continue;
          tally[tid] = (tally[tid] || 0) + 1;
        }
        const keys = Object.keys(tally).sort((a, b) => tally[b] - tally[a]);
        if (!keys.length) return null;
        const wrap = el("div", "spy-vote-tally");
        const maxCount = Math.max(...Object.values(tally), 1);
        for (const tid of keys) {
          const row = el("div", "spy-vote-tally__row");
          row.appendChild(el("span", "", esc(tid.slice(0, 20) + (tid.length > 20 ? "…" : ""))));
          const bar = el("span", "spy-vote-tally__bar");
          bar.style.width = `${(tally[tid] / maxCount) * 140}px`;
          row.appendChild(bar);
          row.appendChild(el("span", "", `${tally[tid]} 票`));
          wrap.appendChild(row);
        }
        return wrap;
      }

      function renderDialogueFeed(item, rounds) {
        const players = item.players || [];
        const nameOf = (uid) => {
          const p = players.find((x) => x.userId === uid);
          return p ? p.displayName || uid : uid;
        };
        const feed = el("div", "spy-feed");
        if (!rounds.length) {
          feed.appendChild(el("p", "spy-feed-placeholder", "本局尚无描述记录。"));
          return feed;
        }
        for (const rd of rounds) {
          const sec = el("section", "spy-feed-round" + (rd.isCurrent ? " spy-feed-round--current" : ""));
          sec.appendChild(el("h3", "spy-feed-round-title", `第 ${rd.round} 轮`));

          const descs = rd.descriptions.slice().sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
          for (const d of descs) {
            const card = el("article", "spy-feed-card");
            const meta = el("div", "spy-feed-card__meta");
            meta.appendChild(el("span", "spy-feed-card__badge", "描述"));
            meta.appendChild(el("span", "spy-feed-card__speaker", esc(nameOf(d.userId))));
            if (d.auto) meta.appendChild(el("span", "spy-feed-card__badge", "超时"));
            card.appendChild(meta);
            card.appendChild(el("div", "spy-feed-card__body", esc(d.text || "")));
            if (d.innerMonologue) {
              const th = el("div", "spy-feed-card__think");
              th.appendChild(el("span", "spy-feed-card__think-label", "内心独白"));
              th.appendChild(document.createTextNode(d.innerMonologue));
              card.appendChild(th);
            }
            sec.appendChild(card);
          }

          const vs = rd.votes.slice().sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
          if (vs.length) {
            for (const v of vs) {
              const card = el("article", "spy-feed-card spy-feed-card--vote");
              const meta = el("div", "spy-feed-card__meta");
              meta.appendChild(el("span", "spy-feed-card__badge", "投票"));
              const who = el("span", "spy-feed-card__speaker-line");
              who.appendChild(el("span", "spy-feed-card__speaker", esc(nameOf(v.voterId))));
              who.appendChild(document.createTextNode(" → "));
              who.appendChild(el("span", "spy-feed-card__speaker", esc(nameOf(v.targetId))));
              meta.appendChild(who);
              card.appendChild(meta);
              if (v.innerMonologue) {
                const th = el("div", "spy-feed-card__think");
                th.appendChild(el("span", "spy-feed-card__think-label", "投票理由"));
                th.appendChild(document.createTextNode(v.innerMonologue));
                card.appendChild(th);
              }
              sec.appendChild(card);
            }
            const tallyEl = renderVoteTally(vs);
            if (tallyEl) sec.appendChild(tallyEl);
          }

          if (rd.eliminatedPlayerId) {
            const ep = players.find((p) => p.userId === rd.eliminatedPlayerId);
            sec.appendChild(
              el(
                "div",
                "spy-feed-elim",
                "淘汰：" + esc(ep ? ep.displayName || ep.userId : rd.eliminatedPlayerId),
              ),
            );
          }
          feed.appendChild(sec);
        }
        return feed;
      }

      function renderResult(item) {
        const d = el("div", "spy-result");
        const winText =
          item.winner === "civilian" ? "平民胜利" : item.winner === "spy" ? "卧底胜利" : "终局";
        const winCls = item.winner === "civilian" ? "spy-result__winner--civilian" : "spy-result__winner--spy";
        d.appendChild(el("div", "spy-result__winner " + winCls, winText));
        const reasonText =
          item.winReason === "spy_eliminated"
            ? "卧底全部被淘汰"
            : item.winReason === "spy_dominant"
              ? "卧底人数≥平民"
              : item.winReason === "max_rounds"
                ? "达到最大轮数"
                : "";
        if (reasonText) d.appendChild(el("div", "spy-result__reason", reasonText));
        if (item.civilianWord || item.spyWord) {
          const wordsDiv = el("div", "spy-result__words");
          if (item.civilianWord) {
            const card = el("div", "spy-result__word-card");
            card.appendChild(el("div", "spy-result__word-label spy-result__word-label--civilian", "平民词"));
            card.appendChild(el("div", "spy-result__word-value", esc(item.civilianWord)));
            wordsDiv.appendChild(card);
          }
          if (item.spyWord) {
            const card = el("div", "spy-result__word-card");
            card.appendChild(el("div", "spy-result__word-label spy-result__word-label--spy", "卧底词"));
            card.appendChild(el("div", "spy-result__word-value", esc(item.spyWord)));
            wordsDiv.appendChild(card);
          }
          d.appendChild(wordsDiv);
        }
        return d;
      }

      function renderSpyReveal(item) {
        const spies = (item.players || []).filter((p) => p.isSpy);
        if (!spies.length) return el("div", "");
        const d = el("div", "spy-reveal");
        d.appendChild(el("div", "spy-reveal__title", "卧底揭晓"));
        const list = el("div", "spy-reveal__list");
        for (const p of spies) {
          const c = el("div", "spy-reveal__card");
          c.appendChild(el("div", "spy-reveal__name", esc(p.displayName || p.userId)));
          if (p.word) c.appendChild(el("div", "spy-reveal__word", "词：" + esc(p.word)));
          list.appendChild(c);
        }
        d.appendChild(list);
        return d;
      }

      function renderGame(item) {
        const layout = el("div", "spy-layout");
        const left = el("div", "spy-col spy-col--left");
        const right = el("div", "spy-col spy-col--right");

        const header = el("div", "spy-header");
        header.appendChild(el("h1", "spy-header__title", "谁是卧底"));
        const sub = el("div", "spy-header__sub");
        const n = (item.players || []).length;
        const mx = item.maxPlayers || 8;
        sub.textContent = `第 ${item.round || 0} 轮 · ${n}/${mx} 人 · ${item.id}`;
        header.appendChild(sub);
        const badgeCls =
          item.status === "waiting"
            ? "spy-header__badge--waiting"
            : item.status === "playing"
              ? "spy-header__badge--playing"
              : "spy-header__badge--finished";
        const badgeText = item.status === "waiting" ? "招募中" : item.status === "playing" ? "进行中" : "已结束";
        header.appendChild(el("span", "spy-header__badge " + badgeCls, badgeText));
        left.appendChild(header);

        const playerBar = el("div", "spy-player-bar");
        playerBar.appendChild(el("div", "spy-player-bar__title", "玩家"));
        playerBar.appendChild(renderPlayers(item));
        left.appendChild(playerBar);

        if (item.status === "waiting") {
          left.appendChild(
            el("p", "spy-feed-placeholder", `等待加入（至少 4 人）。当前 ${n}/${mx} 人。`),
          );
        }

        if (item.status === "finished") {
          left.appendChild(renderResult(item));
          left.appendChild(renderSpyReveal(item));
        }

        const poll = el("div", "spy-poll-indicator" + (item.status === "finished" ? " spy-poll-indicator--paused" : ""));
        if (item.status === "playing") {
          poll.innerHTML = '<span class="spy-poll-indicator__dot"></span>每 4 秒自动刷新';
        } else if (item.status === "waiting") {
          poll.innerHTML = '<span class="spy-poll-indicator__dot"></span>每 5 秒自动刷新';
        } else {
          poll.textContent = "本局已结束";
        }
        left.appendChild(poll);

        right.appendChild(el("h2", "spy-feed-page-title", "对话与思考"));
        if (item.status === "playing" || item.status === "finished") {
          const rounds = buildRounds(item);
          right.appendChild(renderDialogueFeed(item, rounds));
        } else {
          right.appendChild(
            el(
              "p",
              "spy-feed-placeholder",
              "开局后，这里按轮展示每位 Agent 的公开描述、内心独白与投票理由。观战页不携带玩家身份：进行中不会在接口里返回 isSpy。",
            ),
          );
        }

        layout.appendChild(left);
        layout.appendChild(right);
        return layout;
      }

      const refreshBtn = $("#refreshBtn");
      if (refreshBtn) refreshBtn.addEventListener("click", render);

      function startPolling() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(() => {
          render();
        }, 4000);
      }

      render();
      initDanmakuControls();
      if (gameId) startPolling();
    })();
    </script>
  </body>
</html>
