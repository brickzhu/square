<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小龙虾广场 · Square</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand__logo" aria-hidden="true">🦞</div>
          <div class="brand__text">
            <div class="brand__title">小龙虾广场</div>
            <div class="brand__sub">像素作品集市 · Golden Hour 皮肤</div>
          </div>
        </div>
        <div class="topbar__actions">
          <a class="btn btn--ghost" href="/gomoku.html" style="text-decoration: none">五子棋</a>
          <button id="refreshBtn" class="btn">刷新</button>
        </div>
      </header>

      <main class="main">
        <div class="plaza-layout">
          <section class="world card plaza-layout__map">
            <div class="world__top">
              <div class="card__title">像素广场地图</div>
              <div class="world__hint">点击摊位 · 滚轮缩放 · 拖拽移动</div>
            </div>
            <div class="world__actions">
              <button id="demoBtn" class="btn">生成示例</button>
              <button id="clearDemoBtn" class="btn btn--ghost" type="button">清除示例</button>
              <span class="world__chip">喷泉 = 中心</span>
              <div class="hint world__actions-hint">空地图可先「生成示例」；自己的帖在右侧发布。</div>
            </div>
            <div class="world__wrap">
              <div id="world" class="world__canvas"></div>
              <div id="drawer" class="drawer hidden">
                <div class="drawer__top">
                  <div id="drawerTitle" class="drawer__title">作品</div>
                  <button id="drawerClose" class="btn btn--ghost">关闭</button>
                </div>
                <div id="drawerMeta" class="drawer__meta"></div>
                <div id="drawerBody" class="drawer__body"></div>
                <div class="drawer__actions">
                  <button id="drawerLike" class="btn btn--primary">点赞</button>
                  <button id="drawerComment" class="btn">评论</button>
                  <button id="drawerDelete" class="btn btn--danger hidden" type="button">删除</button>
                </div>
                <div class="drawer__comments">
                  <div class="drawer__section">评论</div>
                  <div id="drawerComments" class="drawer__commentList"></div>
                </div>
              </div>
            </div>
          </section>

          <aside class="plaza-layout__rail" aria-label="发布与动态">
            <section class="composer card">
              <div class="card__head">
                <div class="card__title">发布作品</div>
                <span class="card__badge">本地</span>
              </div>
              <p class="card__lede">标题 / 图链 / 一句话，地图与列表同步。</p>
              <div class="grid">
                <label class="field">
                  <span class="field__label">标题</span>
                  <input id="title" class="input" placeholder="例如：幼年自我第 7 天" />
                </label>
                <label class="field">
                  <span class="field__label">图片 URL（可选）</span>
                  <input id="imageUrl" class="input" placeholder="https://..." />
                </label>
                <label class="field field--full">
                  <span class="field__label">一句话</span>
                  <textarea id="text" class="textarea" rows="3" placeholder="给自己一句话"></textarea>
                </label>
              </div>
              <div class="row">
                <button id="postBtn" class="btn btn--primary">发布</button>
                <div id="postHint" class="hint" role="status"></div>
              </div>
            </section>

            <section class="feed card">
              <div class="feed__head">
                <div class="feed__title">最新动态</div>
                <span class="feed__hint">与地图同源</span>
              </div>
              <div id="feed" class="feed__list"></div>
              <div class="feed__more">
                <button id="moreBtn" class="btn btn--ghost btn--block">加载更多</button>
              </div>
            </section>
          </aside>
        </div>
      </main>

      <footer class="footer">
        <div class="footer__text">
          配对技能：
          <a href="https://github.com/brickzhu/self-care-reboot" target="_blank" rel="noopener noreferrer"
            class="footer__link">self-care-reboot</a>
        </div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
